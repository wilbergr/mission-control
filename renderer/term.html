<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Terminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #0d1117; overflow: hidden; }
    #term { height: 100%; padding: 4px 0 0 6px; }
    #term .xterm { height: 100%; }
    #gone {
      display: none; position: fixed; inset: auto 0 0 0; padding: 6px 10px;
      background: #2a1d13; color: #ffd58a; border-top: 1px solid #6b5320;
      font: 12px "Segoe UI", sans-serif;
    }
    #dock {
      position: fixed; top: 6px; right: 16px; z-index: 10;
      background: #11151fcc; color: #8b949e; border: 1px solid #232a3a;
      border-radius: 4px; padding: 2px 10px; font: 12px "Segoe UI", sans-serif;
      cursor: pointer; opacity: .35;
    }
    #dock:hover { opacity: 1; color: #c9d1d9; }
  </style>
</head>
<body>
  <button id="dock" title="Re-dock into the main grid (Ctrl+Shift+D) — session keeps running" data-icon="dock"> Dock</button>
  <div id="term"></div>
  <div id="gone">Session ended.</div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="themes.js"></script>
  <script src="icons.js"></script>
  <script src="term.js"></script>
</body>
</html>
